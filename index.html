<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        background-color: #eee;
      }
      .flex {
        display: flex;
      }
      .baise {
        background-color: white;
      }
      .flex1 {
        flex: 1;
      }
      .column {
        flex-direction: column;
      }
       .yinYing {
        box-shadow: rgb(0 0 0 / 20%) 0px 2px 1px -1px,
          rgb(0 0 0 / 14%) 0px 1px 1px 0px, rgb(0 0 0 / 12%) 0px 1px 3px 0px;
      }
      .mg8 {
        margin: 8px;
      }
      .mgr8 {
        margin: right 8px;
      }
      .mgt8 {
        margin-top: 8px;
      }
      .shuJu {
        height: 100px;
      }
      /* 中间的大盒子 */
      .lieBiaoXiang {
        height: 160px;
      }
      /* 导航条 */
      .daoHang {
        padding: 10px 20px;
        border-bottom: 1px solid rgb(201, 201, 201);
        font-size: 14px;
        color: #666;
      }
      .daoHan{
        padding: 10px 20px;
        border-bottom: 1px solid rgb(190, 185, 185);
        font-size: 14px;
        color: #666;
      }
      /* 当屏幕小于600px时要改变的css */
      @media(max-wideth:600px){
        .ceBain{
          display: none;
        }
        .neiRong{
          flex-direction: column;
        }
        .shuJuQu{
          flex-direction: column;
        }
        .youQu{
          margin-left: 8px;
        }
        .shuJu{
          margin: 0 0 8px;
          flex: auto;
        }
    
      }
    </style>
  </head>
  <body class="flex">
    <!-- 侧边栏 -->
    <div style="width: 200px; z-index:3"  class="ceBain baise flex column yinYing">
      <!-- 头像栏 -->
      <div style="padding: 10px;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #999;" 
      class="flex"
      >
        <img src="https://kangwenchang.com/logo.png" 
        width="40px"
        height="40px" alt=""
        <div style="margin-left: 10px;">施瑞</div>
         <!-- 导航栏 -->
       <div class="flex1">
        <div class="daoHan">导航</div>
        <div class="daoHan">导航</div>
        <div class="daoHan">导航</div>
        <div class="daoHan">导航</div>
        <div class="daoHan">导航</div>
       </div>
      </div>
    <!-- 主区域 -->
    <div class="flex1 flex column">
      <!-- 头部栏 -->
      <div style="height: 60px;z-index: 1;" class="baise yinYing"></div>
      <!-- 内容区 -->
      <div style="overflow: auto" class="neiRong flex1 flex">
        <!-- 左区 -->
        <div style="flex: 3" class="mg8 flex column">
           <!-- 数据区 -->
        <div class="flex shuJuQu">
          <!-- 数据块 -->
          <div style="height: 100px" class="shuJu yinYing flex1 baise mgr8"></div>
          <div style="height: 100px" class="shuJu yinYing flex1 baise mgr8"></div>
          <div style="height: 100px" class="shuJu yinYing flex1 baise mgr8"></div>
          <div style="height: 100px" class="shuJu yinYing flex1 baise"></div>
        </div>
        <!-- 列表区 -->
        <div class="flex column">
          <!-- 列表项 -->
          <div style="height: 160px" class="lieBiaoXiang yinYing baise mgt8"></div>
          <div style="height: 160px" class="lieBiaoXiang yinYing baise mgt8"></div>
          <div style="height: 160px" class="lieBiaoXiang yinYing baise mgt8"></div>
        </div>
        </div>
       
        <!-- 右区 -->
        <div style="flex: 1" class="youQu flex column mgr8 mgt8">
          <!-- 提示区 -->
          <div style="height: 150px" class="baise yinYing"></div>
          <!-- 消息区 -->
          <div style="height: 300px" class="baise mgt8 yinYing"></div>
        </div>
      </div>
    </div>
  </body>
</html>
